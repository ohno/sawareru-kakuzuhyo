# Builds the site for every pull request, so that a broken YAML file or script is caught before it is merged.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python scripts/build.py --no-ktuy
