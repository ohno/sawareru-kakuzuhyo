# Elements by Z (0 = the neutron; 119–126 have their systematic names only).
#   discovered  the "Observed" year of Wikipedia "Timeline of chemical element discoveries" (oldid=1384258232)
#   description, isotopes [A, note]  written for this app; description_en and the last item of each isotope, their English
elements:
  - Z: 0
    symbol: 'n'
    en: Neutron
    ja: 中性子
    discovered: 1932
    description: 陽子とともに原子核をつくる電気を帯びない粒子で、1932年にイギリスのチャドウィックが発見しました。原子核の外に出た自由な中性子は不安定で、半減期約10分で陽子・電子・反ニュートリノに崩壊します。
    description_en: "A particle with no electric charge that, together with protons, makes up atomic nuclei. It was discovered in 1932 by the British physicist James Chadwick. A free neutron outside the nucleus is unstable and decays with a half-life of about 10 minutes into a proton, an electron and an antineutrino."
    isotopes:
      - [1, '自由中性子・半減期約10分', "Free neutron; half-life about 10 minutes"]

  - Z: 1
    symbol: H
    en: Hydrogen
    ja: 水素
    discovered: 1671
    description: 宇宙で最も多く存在する元素で、恒星は水素の核融合によって輝いています。名前はギリシャ語の「水を生むもの」に由来し、燃料電池などのクリーンなエネルギー源としても注目されています。
    description_en: "The most abundant element in the universe; stars shine through the nuclear fusion of hydrogen. Its name comes from the Greek for \"water-former\", and it is also attracting attention as a clean energy source, for example in fuel cells."
    isotopes:
      - [1, '軽水素・天然の約99.99%', "Protium; about 99.99% of natural hydrogen"]
      - [2, '重水素・核融合の燃料', "Deuterium; fuel for nuclear fusion"]
      - [3, '三重水素・半減期約12年', "Tritium; half-life about 12 years"]

  - Z: 2
    symbol: He
    en: Helium
    ja: ヘリウム
    discovered: 1868
    description: 1868年の日食の観測で太陽光のスペクトルから見つかり、ギリシャ語の太陽「ヘリオス」にちなんで名付けられました。軽く燃えないため風船に使われ、液体ヘリウムはMRIの超伝導磁石の冷却に欠かせません。
    description_en: "Found in 1868 in the spectrum of sunlight during observations of a solar eclipse, and named after \"helios\", the Greek word for the Sun. Being light and non-flammable, it is used in balloons, and liquid helium is essential for cooling the superconducting magnets of MRI scanners."
    isotopes:
      - [4, 'α粒子・二重魔法数の核', "α particle; doubly magic nucleus"]
      - [3, '希少・極低温の冷却に', "Rare; used for cooling to ultra-low temperatures"]
      - [6, '中性子ハロー核', "Neutron halo nucleus"]

  - Z: 3
    symbol: Li
    en: Lithium
    ja: リチウム
    discovered: 1817
    description: 1817年にスウェーデンのアルフェドソンが発見し、ギリシャ語の「石（リトス）」が名前の由来です。最も軽い金属で、スマートフォンや電気自動車のリチウムイオン電池に欠かせません。
    description_en: "Discovered in 1817 by the Swedish chemist Arfwedson; its name comes from the Greek word for \"stone\" (lithos). It is the lightest metal and is essential to the lithium-ion batteries in smartphones and electric vehicles."
    isotopes:
      - [7, '天然の約95%', "About 95% of natural lithium"]
      - [6, '核融合炉でトリチウム生産', "Used to produce tritium in fusion reactors"]
      - [11, '中性子ハロー核の代表例', "A classic example of a neutron halo nucleus"]

  - Z: 4
    symbol: Be
    en: Beryllium
    ja: ベリリウム
    discovered: 1798
    description: 宝石の緑柱石（ベリル）が名前の由来で、1798年にフランスのボークランが発見しました。軽くて硬くX線を通しやすいため、X線装置の窓や宇宙望遠鏡の鏡に使われますが、粉じんには強い毒性があります。
    description_en: "Named after the gemstone beryl, it was discovered in 1798 by the French chemist Vauquelin. Light, hard and easily penetrated by X-rays, it is used for the windows of X-ray equipment and the mirrors of space telescopes, but its dust is highly toxic."
    isotopes:
      - [9, '唯一の安定同位体', "The only stable isotope"]
      - [10, '宇宙線で生成・約139万年', "Produced by cosmic rays; about 1.39 million years"]
      - [11, '中性子ハロー核', "Neutron halo nucleus"]

  - Z: 5
    symbol: B
    en: Boron
    ja: ホウ素
    discovered: 1787
    description: 鉱物のホウ砂（ボラックス）が名前の由来で、1808年にゲイ＝リュサックらとデービーがそれぞれ単離しました。耐熱ガラスや半導体に使われ、ホウ素10は中性子をよく吸収するため原子炉の制御にも役立ちます。
    description_en: "Named after the mineral borax, it was isolated in 1808 independently by Gay-Lussac and colleagues and by Davy. It is used in heat-resistant glass and semiconductors, and because boron-10 absorbs neutrons well, it also helps control nuclear reactors."
    isotopes:
      - [11, '天然の約80%', "About 80% of natural boron"]
      - [10, '中性子を吸収・がん治療にも', "Absorbs neutrons; also used in cancer therapy"]
      - [8, '太陽ニュートリノの源', "Source of solar neutrinos"]

  - Z: 6
    symbol: C
    en: Carbon
    ja: 炭素
    discovered: ancient
    description: ラテン語の「木炭（カルボ）」が名前の由来で、ダイヤモンドや黒鉛など性質の大きく異なる姿をとります。すべての生物の体をつくる基本元素で、放射性の炭素14は遺跡や遺物の年代測定に使われます。
    description_en: "Its name comes from the Latin for \"charcoal\" (carbo), and it takes forms with very different properties, such as diamond and graphite. It is the basic element that makes up the bodies of all living things, and radioactive carbon-14 is used to date archaeological sites and artifacts."
    isotopes:
      - [12, '原子質量の基準・天然の約99%', "Standard for atomic mass; about 99% of natural carbon"]
      - [14, '年代測定・半減期約5700年', "Used for dating; half-life about 5,700 years"]
      - [11, 'PET検査に利用', "Used in PET scans"]

  - Z: 7
    symbol: 'N'
    en: Nitrogen
    ja: 窒素
    discovered: 1772
    description: 空気の約8割を占める気体で、1772年にスコットランドのダニエル・ラザフォードが発見しました。タンパク質やDNAに欠かせない元素で、アンモニアを経て化学肥料の原料として大量に使われています。
    description_en: "A gas that makes up about 80% of the air, discovered in 1772 by the Scottish chemist Daniel Rutherford. It is essential to proteins and DNA, and, by way of ammonia, it is used in huge amounts as a raw material for chemical fertilizers."
    isotopes:
      - [14, '天然の約99.6%', "About 99.6% of natural nitrogen"]
      - [15, '安定・窒素循環の追跡に', "Stable; used to trace the nitrogen cycle"]
      - [13, 'PET検査に利用', "Used in PET scans"]

  - Z: 8
    symbol: O
    en: Oxygen
    ja: 酸素
    discovered: 1771
    description: 1770年代にシェーレとプリーストリーがそれぞれ発見し、ラボアジエが「酸を生むもの」という意味で命名しました。地殻の中で最も多い元素で、私たちの呼吸や物が燃えることに欠かせません。
    description_en: "Discovered independently by Scheele and Priestley in the 1770s, and named by Lavoisier with a word meaning \"acid-former\". It is the most abundant element in the Earth's crust and is essential for our breathing and for things to burn."
    isotopes:
      - [16, '二重魔法数・天然の約99.8%', "Doubly magic; about 99.8% of natural oxygen"]
      - [18, '古気温の指標・PET原料', "Indicator of past temperatures; raw material for PET tracers"]
      - [28, '理研RIBFで初観測', "First observed at RIKEN RIBF"]

  - Z: 9
    symbol: F
    en: Fluorine
    ja: フッ素
    discovered: 1771
    description: 鉱物の蛍石（フローライト）が名前の由来で、1886年にフランスのモアッサンが単体の分離に成功しました。非常に反応しやすい元素で、虫歯予防の歯みがき粉やフライパンのフッ素樹脂加工に利用されています。
    description_en: "Named after the mineral fluorite, it was first isolated as a pure element in 1886 by the French chemist Henri Moissan. It is an extremely reactive element, used in toothpaste to prevent tooth decay and in the fluoropolymer coating on frying pans."
    isotopes:
      - [19, '唯一の安定同位体', "The only stable isotope"]
      - [18, 'PET検査の定番・約110分', "The standard for PET scans; about 110 minutes"]

  - Z: 10
    symbol: Ne
    en: Neon
    ja: ネオン
    discovered: 1898
    description: ギリシャ語の「新しい」が名前の由来で、1898年にラムゼーとトラバースが液体空気から発見しました。放電させると鮮やかな赤橙色に光り、ネオンサインとして街を彩ってきました。
    description_en: "Its name comes from the Greek word for \"new\", and it was discovered in liquid air in 1898 by Ramsay and Travers. When an electric discharge passes through it, it glows a vivid reddish orange, and as neon signs it has long brightened city streets."
    isotopes:
      - [20, '天然の約90%', "About 90% of natural neon"]
      - [22, '天然の約9%', "About 9% of natural neon"]

  - Z: 11
    symbol: Na
    en: Sodium
    ja: ナトリウム
    discovered: 1702
    description: 食塩（塩化ナトリウム）の成分で、1807年にイギリスのデービーが電気分解によって初めて単離しました。元素記号Naはラテン語名ナトリウムに由来し、黄色く光るナトリウムランプはトンネルの照明などに使われてきました。
    description_en: "A component of table salt (sodium chloride), it was first isolated by electrolysis in 1807 by the British chemist Humphry Davy. Its symbol Na comes from its Latin name, natrium, and sodium lamps, which glow yellow, have been used to light tunnels and other places."
    isotopes:
      - [23, '唯一の安定同位体', "The only stable isotope"]
      - [22, '陽電子源・半減期約2.6年', "Positron source; half-life about 2.6 years"]

  - Z: 12
    symbol: Mg
    en: Magnesium
    ja: マグネシウム
    discovered: 1755
    description: ギリシャのマグネシア地方が名前の由来で、1808年にデービーが単離しました。軽くて丈夫な合金としてノートパソコンや自動車に使われ、植物の葉緑素の中心にも含まれています。
    description_en: "Named after the Magnesia region of Greece, it was isolated by Davy in 1808. Its light, strong alloys are used in laptop computers and cars, and it sits at the center of chlorophyll in plant leaves."
    isotopes:
      - [24, '天然の約79%', "About 79% of natural magnesium"]
      - [32, '「逆転の島」・理研で研究', "\"Island of inversion\"; studied at RIKEN"]
      - [40, '理研で励起状態を初観測', "Excited state first observed at RIKEN"]

  - Z: 13
    symbol: Al
    en: Aluminium
    ja: アルミニウム
    discovered: 1746
    description: 地殻に最も多く含まれる金属で、ミョウバン（アルム）が名前の由来です。軽くてさびにくいため、1円玉や飲料缶、航空機の材料など身近なところで広く使われています。
    description_en: "The most abundant metal in the Earth's crust; its name comes from alum. Light and resistant to corrosion, it is widely used in everyday things such as 1-yen coins, drink cans and aircraft materials."
    isotopes:
      - [27, '唯一の安定同位体', "The only stable isotope"]
      - [26, '銀河のγ線源・約72万年', "Source of γ-rays in the Galaxy; about 720,000 years"]

  - Z: 14
    symbol: Si
    en: Silicon
    ja: ケイ素
    discovered: 1739
    description: 酸素に次いで地殻に多い元素で、ラテン語の「火打ち石（シレックス）」が名前の由来です。コンピューターの半導体チップや太陽電池の材料として、現代のエレクトロニクスを支えています。
    description_en: "The second most abundant element in the Earth's crust after oxygen; its name comes from the Latin for \"flint\" (silex). As the material for computer semiconductor chips and solar cells, it underpins modern electronics."
    isotopes:
      - [28, '天然の約92%・kg再定義に', "About 92% of natural silicon; used to redefine the kilogram"]
      - [32, '宇宙線で生成・約157年', "Produced by cosmic rays; about 157 years"]

  - Z: 15
    symbol: P
    en: Phosphorus
    ja: リン
    discovered: 1669
    description: 1669年にドイツのブラントが尿から発見し、ギリシャ語の「光を運ぶもの」が名前の由来です。白リンは暗い所で青白く光ることで知られ、DNAや骨、エネルギー分子ATPに欠かせない元素です。
    description_en: "Discovered in urine in 1669 by the German alchemist Hennig Brand; its name comes from the Greek for \"light-bearer\". White phosphorus is known for glowing pale blue in the dark, and the element is essential to DNA, bones and the energy molecule ATP."
    isotopes:
      - [31, '唯一の安定同位体', "The only stable isotope"]
      - [32, '生化学の標識・約14日', "Tracer in biochemistry; about 14 days"]

  - Z: 16
    symbol: S
    en: Sulfur
    ja: 硫黄
    discovered: ancient
    description: 古代から知られる元素で、火山の噴気孔の近くなどで黄色い結晶として見つかります。ゴムを丈夫にする加硫や硫酸の製造に使われ、温泉の独特なにおいは硫化水素によるものです。
    description_en: "An element known since ancient times, found as yellow crystals near volcanic vents and similar places. It is used in vulcanization, which makes rubber tough, and in making sulfuric acid, and the distinctive smell of hot springs comes from hydrogen sulfide."
    isotopes:
      - [32, '天然の約95%', "About 95% of natural sulfur"]
      - [35, '標識に利用・約87日', "Used as a tracer; about 87 days"]

  - Z: 17
    symbol: Cl
    en: Chlorine
    ja: 塩素
    discovered: 1774
    description: 1774年にシェーレが発見し、黄緑色の気体であることからギリシャ語の「黄緑」にちなんで名付けられました。強い殺菌作用があり、水道水やプールの消毒、塩化ビニルの原料などに使われます。
    description_en: "Discovered by Scheele in 1774 and named after the Greek word for \"yellow-green\" because it is a yellow-green gas. It is a strong disinfectant, used to treat tap water and swimming pools, and is also a raw material for PVC (polyvinyl chloride)."
    isotopes:
      - [35, '天然の約76%', "About 76% of natural chlorine"]
      - [37, '太陽ニュートリノ検出に', "Used to detect solar neutrinos"]
      - [36, '地下水の年代測定・約30万年', "Dating groundwater; about 300,000 years"]

  - Z: 18
    symbol: Ar
    en: Argon
    ja: アルゴン
    discovered: 1894
    description: 空気中に約1%含まれる気体で、1894年にレイリーとラムゼーが発見しました。ギリシャ語の「怠け者」が名前の由来で、ほとんど反応しない性質を生かして溶接や電球の封入ガスに使われます。
    description_en: "A gas that makes up about 1% of the air, discovered in 1894 by Rayleigh and Ramsay. Its name comes from the Greek for \"lazy\", and because it hardly reacts at all, it is used in welding and as the fill gas in light bulbs."
    isotopes:
      - [40, '天然の約99.6%・K崩壊由来', "About 99.6% of natural argon; produced by the decay of K"]
      - [39, '地下水の年代測定・約270年', "Dating groundwater; about 270 years"]

  - Z: 19
    symbol: K
    en: Potassium
    ja: カリウム
    discovered: 1702
    description: 1807年にデービーが電気分解で単離し、草木の灰（ポタッシュ）が英語名の由来です。元素記号Kはカリウム（Kalium）という名前に由来し、植物の三大栄養素の一つとして肥料にも使われます。
    description_en: "Isolated by Davy by electrolysis in 1807; its English name comes from potash, the ash of plants. Its symbol K comes from the name kalium, and as one of the three major plant nutrients it is also used in fertilizers."
    isotopes:
      - [39, '天然の約93%', "About 93% of natural potassium"]
      - [40, '体内の放射能・年代測定', "Radioactivity in our bodies; used for dating"]
      - [41, '天然の約7%', "About 7% of natural potassium"]

  - Z: 20
    symbol: Ca
    en: Calcium
    ja: カルシウム
    discovered: 1739
    description: ラテン語の「石灰（カルクス）」が名前の由来で、1808年にデービーが単離しました。骨や歯の主成分であり、石灰石やセメント、チョークなど身近な材料にも含まれています。
    description_en: "Its name comes from the Latin for \"lime\" (calx), and it was isolated by Davy in 1808. It is the main component of bones and teeth, and is also found in familiar materials such as limestone, cement and chalk."
    isotopes:
      - [40, '二重魔法数・天然の約97%', "Doubly magic; about 97% of natural calcium"]
      - [48, '二重魔法数・超重元素合成に', "Doubly magic; used to make superheavy elements"]
      - [54, '新魔法数34の証拠・理研', "Evidence for the new magic number 34; RIKEN"]

  - Z: 21
    symbol: Sc
    en: Scandium
    ja: スカンジウム
    discovered: 1879
    description: 1879年にスウェーデンのニルソンが発見し、スカンジナビアにちなんで名付けられました。メンデレーエフが存在を予言した「エカホウ素」にあたり、アルミニウム合金の強化などに使われます。
    description_en: "Discovered in 1879 by the Swedish chemist Nilson and named after Scandinavia. It is the \"eka-boron\" whose existence Mendeleev had predicted, and it is used to strengthen aluminium alloys, among other things."
    isotopes:
      - [45, '唯一の安定同位体', "The only stable isotope"]
      - [44, 'PET用に研究中', "Being studied for PET"]

  - Z: 22
    symbol: Ti
    en: Titanium
    ja: チタン
    discovered: 1791
    description: ギリシャ神話の巨人族タイタンにちなんで名付けられた金属です。軽くて強く、さびにくく人体にもなじみやすいため、航空機やメガネのフレーム、人工関節などに使われます。
    description_en: "A metal named after the Titans, the race of giants in Greek mythology. Light, strong, resistant to corrosion and well tolerated by the human body, it is used in aircraft, eyeglass frames and artificial joints."
    isotopes:
      - [48, '天然の約74%', "About 74% of natural titanium"]
      - [44, '超新星で生成・約59年', "Made in supernovae; about 59 years"]

  - Z: 23
    symbol: V
    en: Vanadium
    ja: バナジウム
    discovered: 1801
    description: 化合物が美しく多彩な色を示すことから、北欧神話の美の女神ヴァナディースにちなんで名付けられました。鉄に少し加えると強い鋼ができ、工具や自動車部品に使われます。
    description_en: "Because its compounds show beautiful and varied colors, it was named after Vanadís, the goddess of beauty in Norse mythology. Adding a little to iron makes a strong steel, which is used in tools and car parts."
    isotopes:
      - [51, '天然の99.75%', "99.75% of natural vanadium"]
      - [50, 'ごく長寿命の天然放射性核', "Extremely long-lived natural radioactive nucleus"]

  - Z: 24
    symbol: Cr
    en: Chromium
    ja: クロム
    discovered: 1797
    description: 化合物がさまざまな色を示すことから、ギリシャ語の「色（クロマ）」にちなんで名付けられました。さびにくく光沢があるためめっきやステンレス鋼に使われ、ルビーの赤色もクロムによるものです。
    description_en: "Because its compounds show many different colors, it was named after the Greek word for \"color\" (chroma). Being resistant to corrosion and shiny, it is used for plating and in stainless steel, and the red of rubies also comes from chromium."
    isotopes:
      - [52, '天然の約84%', "About 84% of natural chromium"]
      - [51, '赤血球の標識・約28日', "Labeling red blood cells; about 28 days"]

  - Z: 25
    symbol: Mn
    en: Manganese
    ja: マンガン
    discovered: 1770
    description: 1774年にスウェーデンのガーンが単離した金属です。鋼を強くする添加元素として製鉄に欠かせず、乾電池の材料としても身近な元素です。
    description_en: "A metal isolated in 1774 by the Swedish chemist Gahn. As an additive that makes steel stronger, it is indispensable in steelmaking, and it is also a familiar element as a material in dry-cell batteries."
    isotopes:
      - [55, '唯一の安定同位体', "The only stable isotope"]
      - [53, '隕石の年代測定・約370万年', "Dating meteorites; about 3.7 million years"]

  - Z: 26
    symbol: Fe
    en: Iron
    ja: 鉄
    discovered: ancient
    description: 古代から使われてきた金属で、建物や乗り物など現代文明を支える鉄鋼の主成分です。原子核は核子1個あたりの結合エネルギーが特に大きく、恒星の核融合による元素合成は鉄のあたりで止まります。
    description_en: "A metal used since ancient times and the main component of steel, which supports modern civilization in buildings, vehicles and more. Its nucleus has an especially large binding energy per nucleon, and the making of elements by nuclear fusion in stars stops at around iron."
    isotopes:
      - [56, '天然の約92%・結合が非常に強い', "About 92% of natural iron; very tightly bound"]
      - [57, 'メスバウアー分光に利用', "Used in Mössbauer spectroscopy"]
      - [60, '超新星の痕跡・約262万年', "Trace of supernovae; about 2.62 million years"]

  - Z: 27
    symbol: Co
    en: Cobalt
    ja: コバルト
    discovered: 1735
    description: ドイツの鉱山の妖精「コボルト」が名前の由来で、1735年頃にスウェーデンのブラントが発見しました。青い顔料や磁石、電池の材料に使われ、コバルト60はがん治療や滅菌の放射線源になります。
    description_en: "Its name comes from the \"kobold\", a goblin of German mines, and it was discovered around 1735 by the Swedish chemist Georg Brandt. It is used in blue pigments, magnets and battery materials, and cobalt-60 is a radiation source for cancer therapy and sterilization."
    isotopes:
      - [59, '唯一の安定同位体', "The only stable isotope"]
      - [60, 'γ線源・半減期約5.3年', "γ-ray source; half-life about 5.3 years"]

  - Z: 28
    symbol: Ni
    en: Nickel
    ja: ニッケル
    discovered: 1751
