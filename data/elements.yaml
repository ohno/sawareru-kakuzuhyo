    symbol: O
    en: Oxygen
    ja: 酸素
    discovered: 1771
    info: 1770年代にシェーレとプリーストリーがそれぞれ発見し、ラボアジエが「酸を生むもの」という意味で命名しました。地殻の中で最も多い元素で、私たちの呼吸や物が燃えることに欠かせません。
    isotopes:
      - [16, '二重魔法数・天然の約99.8%']
      - [18, '古気温の指標・PET原料']
      - [28, '理研RIBFで初観測']

  - Z: 9
    symbol: F
    en: Fluorine
    ja: フッ素
    discovered: 1771
    info: 鉱物の蛍石（フローライト）が名前の由来で、1886年にフランスのモアッサンが単体の分離に成功しました。非常に反応しやすい元素で、虫歯予防の歯みがき粉やフライパンのフッ素樹脂加工に利用されています。
    isotopes:
      - [19, '唯一の安定同位体']
      - [18, 'PET検査の定番・約110分']

  - Z: 10
    symbol: Ne
    en: Neon
    ja: ネオン
    discovered: 1898
    info: ギリシャ語の「新しい」が名前の由来で、1898年にラムゼーとトラバースが液体空気から発見しました。放電させると鮮やかな赤橙色に光り、ネオンサインとして街を彩ってきました。
    isotopes:
      - [20, '天然の約90%']
      - [22, '天然の約9%']

  - Z: 11
    symbol: Na
    en: Sodium
    ja: ナトリウム
    discovered: 1702
    info: 食塩（塩化ナトリウム）の成分で、1807年にイギリスのデービーが電気分解によって初めて単離しました。元素記号Naはラテン語名ナトリウムに由来し、黄色く光るナトリウムランプはトンネルの照明などに使われてきました。
    isotopes:
      - [23, '唯一の安定同位体']
      - [22, '陽電子源・半減期約2.6年']

  - Z: 12
    symbol: Mg
    en: Magnesium
    ja: マグネシウム
    discovered: 1755
    info: ギリシャのマグネシア地方が名前の由来で、1808年にデービーが単離しました。軽くて丈夫な合金としてノートパソコンや自動車に使われ、植物の葉緑素の中心にも含まれています。
    isotopes:
      - [24, '天然の約79%']
      - [32, '「逆転の島」・理研で研究']
      - [40, '理研で励起状態を初観測']

  - Z: 13
    symbol: Al
    en: Aluminium
    ja: アルミニウム
    discovered: 1746
    info: 地殻に最も多く含まれる金属で、ミョウバン（アルム）が名前の由来です。軽くてさびにくいため、1円玉や飲料缶、航空機の材料など身近なところで広く使われています。
