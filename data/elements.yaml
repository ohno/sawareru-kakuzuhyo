    description_en: "A radioactive element found only in tiny traces in nature, it was made in 1940 at the University of California by bombarding bismuth with alpha particles. Its name comes from the Greek for \"unstable,\" and astatine-211 is being studied for use in cancer treatment."
    isotopes:
      - [210, '最も長寿命・約8時間', "Longest-lived isotope; about 8 hours"]
      - [211, 'α線がん治療・理研で製造', "α-particle cancer therapy; produced at RIKEN"]

  - Z: 86
    symbol: Rn
    en: Radon
    ja: ラドン
    discovered: 1899
    description: ウランやラジウムが崩壊してできる放射性の貴ガスで、1899年にカナダでラザフォードとオーウェンズが発見しました。地中から湧き出て温泉などに含まれ、ラドン温泉として知られています。
    description_en: "A radioactive noble gas produced by the decay of uranium and radium, it was discovered in Canada in 1899 by Rutherford and Owens. It seeps up from underground and is found in hot springs and elsewhere; such springs are known as radon hot springs."
    isotopes:
      - [222, '空気中の自然放射能・約3.8日', "Natural radioactivity in the air; about 3.8 days"]
      - [220, 'トロン・半減期約56秒', "Thoron; half-life about 56 seconds"]

  - Z: 87
    symbol: Fr
    en: Francium
    ja: フランシウム
    discovered: 1939
    description: 1939年にフランスのペレーがアクチニウムの崩壊生成物から発見し、フランスにちなんで名付けられました。最も長寿命の同位体でも半減期は約22分と短く、天然にはごくわずかしか存在しません。
    description_en: "Discovered in 1939 by Marguerite Perey of France among the decay products of actinium, it is named after France. Even its longest-lived isotope has a short half-life of about 22 minutes, and only tiny traces exist in nature."
    isotopes:
      - [223, '最も長寿命・約22分', "Longest-lived isotope; about 22 minutes"]

  - Z: 88
    symbol: Ra
    en: Radium
    ja: ラジウム
    discovered: 1898
    description: 1898年にキュリー夫妻が発見し、強い放射線を出すことからラテン語の「光線」にちなんで名付けられました。かつては夜光塗料に使われ、現在はラジウム223が骨に転移したがんの治療に使われています。
    description_en: "Discovered by Pierre and Marie Curie in 1898, it is named after the Latin word for \"ray\" because it gives off intense radiation. It was once used in luminous paint, and today radium-223 is used to treat cancer that has spread to the bones."
    isotopes:
      - [226, 'キュリー夫妻が発見・約1600年', "Discovered by the Curies; about 1600 years"]
      - [223, '骨転移のがん治療薬', "Drug for cancer that has spread to the bones"]
      - [228, 'トリウム系列・約5.8年', "Thorium series; about 5.8 years"]

  - Z: 89
    symbol: Ac
    en: Actinium
    ja: アクチニウム
    discovered: 1902
    description: 1899年にフランスのドビエルヌが報告し、1902年にドイツのギーゼルも独立に発見しました。名前はギリシャ語の「光線」にちなみます。アクチノイドの先頭の元素で、アクチニウム225は新しいがんのアルファ線治療の候補として注目されています。
    description_en: "It was reported in 1899 by Debierne of France, and in 1902 Giesel of Germany discovered it independently. Its name comes from the Greek for \"ray.\" It is the first of the actinides, and actinium-225 is drawing attention as a candidate for a new alpha-particle therapy for cancer."
    isotopes:
      - [227, '最も長寿命・約22年', "Longest-lived isotope; about 22 years"]
      - [225, 'α線がん治療に注目', "Promising for α-particle cancer therapy"]

  - Z: 90
    symbol: Th
    en: Thorium
    ja: トリウム
    discovered: 1829
    description: 1828年にスウェーデンのベルセリウスが発見して1829年に発表し、北欧神話の雷神トールにちなんで名付けられました。天然に比較的豊富な放射性元素で、将来の原子力燃料の候補としても研究されています。
    description_en: "Discovered in 1828 by Berzelius of Sweden and announced in 1829, it is named after Thor, the Norse god of thunder. It is a radioactive element that is relatively abundant in nature, and it is also being studied as a possible future nuclear fuel."
    isotopes:
      - [232, '天然のほぼ全て・約140億年', "Almost all natural thorium; about 14 billion years"]
      - [229, '原子核時計の候補', "Candidate for a nuclear clock"]
      - [230, 'サンゴ等の年代測定に', "Used to date corals and more"]

  - Z: 91
    symbol: Pa
    en: Protactinium
    ja: プロトアクチニウム
    discovered: 1913
    description: 崩壊してアクチニウムになることから、「アクチニウムの親」という意味で名付けられました。1913年に短寿命の同位体が初めて見つかり、その後ハーンとマイトナーらが長寿命のプロトアクチニウム231を発見しました。
    description_en: "Because it decays into actinium, it was given a name meaning \"parent of actinium.\" A short-lived isotope was first found in 1913, and later Otto Hahn, Lise Meitner and their colleagues discovered the long-lived protactinium-231."
    isotopes:
      - [231, '最も長寿命・約3.3万年', "Longest-lived isotope; about 33,000 years"]
      - [233, 'トリウム燃料サイクルの中間核', "Intermediate nucleus in the thorium fuel cycle"]

  - Z: 92
    symbol: U
    en: Uranium
    ja: ウラン
    discovered: 1789
    description: 1789年にドイツのクラプロートが発見し、少し前に見つかった天王星（ウラヌス）にちなんで名付けられました。1896年にベクレルがウランから放射能を発見し、ウラン235の核分裂は原子力発電に利用されています。
    description_en: "Discovered in 1789 by Klaproth of Germany, it is named after the planet Uranus, which had been found a little earlier. In 1896 Becquerel discovered radioactivity in uranium, and the fission of uranium-235 is used to generate nuclear power."
    isotopes:
      - [238, '天然の約99.3%・約45億年', "About 99.3% of natural uranium; about 4.5 billion years"]
      - [235, '核分裂性・天然の約0.7%', "Fissile; about 0.7% natural abundance"]
      - [233, '核分裂性・トリウムから生成', "Fissile; produced from thorium"]

  - Z: 93
    symbol: Np
    en: Neptunium
    ja: ネプツニウム
    discovered: 1940
    description: 1940年にカリフォルニア大学のマクミランとエーベルソンが作った、最初の超ウラン元素です。ウランの次にあたることから、天王星の外側を回る海王星（ネプチューン）にちなんで名付けられました。
    description_en: "It is the first transuranium element, made in 1940 by McMillan and Abelson at the University of California. Because it comes right after uranium, it is named after Neptune, the planet that orbits beyond Uranus."
    isotopes:
      - [237, '最も長寿命・約214万年', "Longest-lived isotope; about 2.14 million years"]
      - [239, '初めて発見された超ウラン核', "The first transuranium nucleus discovered"]

  - Z: 94
    symbol: Pu
    en: Plutonium
    ja: プルトニウム
    discovered: 1941
    description: 1940年から翌年にかけてシーボーグらがカリフォルニア大学で合成し、冥王星（プルート）にちなんで名付けられました。プルトニウム239は原子炉の燃料などに、プルトニウム238は宇宙探査機の電源に使われます。
    description_en: "Glenn Seaborg and colleagues synthesized it at the University of California from 1940 into 1941, and it is named after Pluto. Plutonium-239 is used as fuel for nuclear reactors and for other purposes, and plutonium-238 is used to power space probes."
    isotopes:
      - [239, '核分裂性・約2.4万年', "Fissile; about 24,000 years"]
      - [238, '探査機の原子力電池', "Nuclear batteries for space probes"]
      - [244, '最も長寿命・約8100万年', "Longest-lived isotope; about 81 million years"]

  - Z: 95
    symbol: Am
    en: Americium
    ja: アメリシウム
    discovered: 1944
    description: 1944年にシーボーグらが合成し、周期表で真上にあるユウロピウムにならってアメリカ大陸にちなんで名付けられました。アメリシウム241は家庭用の煙感知器に使われています。
    description_en: "Synthesized by Seaborg and colleagues in 1944, it was named after the Americas, following the example of europium, which sits directly above it in the periodic table. Americium-241 is used in household smoke detectors."
    isotopes:
      - [241, '煙感知器・約430年', "Smoke detectors; about 430 years"]
      - [243, '最も長寿命・約7350年', "Longest-lived isotope; about 7350 years"]

  - Z: 96
    symbol: Cm
    en: Curium
    ja: キュリウム
    discovered: 1944
    description: 1944年にシーボーグらがプルトニウムにアルファ粒子を当てて合成し、キュリー夫妻にちなんで名付けられました。強い放射能をもち、火星探査車に搭載されたX線分光装置の線源などに使われました。
    description_en: "Synthesized in 1944 by Seaborg and colleagues by bombarding plutonium with alpha particles, it is named after Pierre and Marie Curie. It is intensely radioactive and has been used, for example, as the source in X-ray spectrometers carried on Mars rovers."
    isotopes:
      - [242, '最初に合成された同位体', "The first isotope synthesized"]
      - [244, '火星探査車のα線源', "α source for Mars rovers"]
      - [247, '最も長寿命・約1560万年', "Longest-lived isotope; about 15.6 million years"]

  - Z: 97
    symbol: Bk
    en: Berkelium
    ja: バークリウム
    discovered: 1949
    description: 1949年にカリフォルニア大学バークレー校で合成され、バークレー市にちなんで名付けられました。超重元素テネシンの合成では、標的としてバークリウム249が使われました。
    description_en: "Synthesized in 1949 at the University of California, Berkeley, it is named after the city of Berkeley. Berkelium-249 was used as the target in the synthesis of the superheavy element tennessine."
    isotopes:
      - [243, '最初に合成された同位体', "The first isotope synthesized"]
      - [247, '最も長寿命・約1400年', "Longest-lived isotope; about 1400 years"]
      - [249, 'テネシン合成の標的', "Target for making tennessine"]

  - Z: 98
    symbol: Cf
    en: Californium
    ja: カリホルニウム
    discovered: 1950
    description: 1950年にカリフォルニア大学バークレー校で合成され、カリフォルニア州と大学にちなんで名付けられました。カリホルニウム252は自発核分裂で中性子を出すため、中性子源として利用されています。
    description_en: "Synthesized in 1950 at the University of California, Berkeley, it is named after the state of California and the university. Californium-252 gives off neutrons through spontaneous fission, so it is used as a neutron source."
    isotopes:
      - [252, '強力な中性子源・約2.6年', "Powerful neutron source; about 2.6 years"]
      - [251, '最も長寿命・約900年', "Longest-lived isotope; about 900 years"]
      - [249, 'オガネソン合成の標的', "Target for making oganesson"]

  - Z: 99
    symbol: Es
    en: Einsteinium
    ja: アインスタイニウム
    discovered: 1952
    description: 1952年に太平洋で行われた初の水爆実験の降下物から発見され、アインシュタインにちなんで名付けられました。発見当初は軍事機密とされ、ごく微量しか作れないため用途は研究に限られています。
    description_en: "It was discovered in the fallout from the first hydrogen-bomb test, carried out in the Pacific in 1952, and is named after Albert Einstein. At first its discovery was kept a military secret, and because only tiny amounts can be made, it is used only for research."
    isotopes:
      - [253, '水爆実験の灰から発見', "Found in the ash of a hydrogen-bomb test"]
      - [252, '最も長寿命・約470日', "Longest-lived isotope; about 470 days"]

  - Z: 100
    symbol: Fm
    en: Fermium
    ja: フェルミウム
    discovered: 1953
    description: アインスタイニウムとともに1952年の水爆実験の降下物から発見され、物理学者フェルミにちなんで名付けられました。中性子を吸収させて作れる元素はここまでで、これより重い元素は加速器で合成されます。
    description_en: "Discovered together with einsteinium in the fallout from the 1952 hydrogen-bomb test, it is named after the physicist Enrico Fermi. It is the last element that can be made by neutron absorption; heavier elements are synthesized with accelerators."
    isotopes:
      - [255, '水爆実験の灰から発見', "Found in the ash of a hydrogen-bomb test"]
      - [257, '最も長寿命・約100日', "Longest-lived isotope; about 100 days"]

  - Z: 101
    symbol: Md
    en: Mendelevium
    ja: メンデレビウム
    discovered: 1955
    description: 1955年にカリフォルニア大学バークレー校で、ごく微量のアインスタイニウムにアルファ粒子を当てて合成されました。周期表を作ったメンデレーエフにちなんで名付けられ、最初の実験ではわずか十数個の原子しか作られませんでした。
    description_en: "It was synthesized in 1955 at the University of California, Berkeley, by bombarding a tiny amount of einsteinium with alpha particles. It is named after Mendeleev, who created the periodic table, and the first experiment produced only a dozen or so atoms."
    isotopes:
      - [256, '原子1個ずつ検出して発見', "Discovered by detecting atoms one at a time"]
      - [258, '最も長寿命・約52日', "Longest-lived isotope; about 52 days"]

  - Z: 102
    symbol: 'No'
    en: Nobelium
    ja: ノーベリウム
    discovered: 1965  # 1965 年の実験（1966 年発表、Dubna）
    description: 1957年にストックホルムのノーベル研究所が発見を報告したことから、アルフレッド・ノーベルにちなんで名付けられました。その報告は再現されず、確実な合成はソ連のドゥブナの研究グループによるものと認められています。
    description_en: "It is named after Alfred Nobel because the Nobel Institute in Stockholm reported its discovery in 1957. That report could not be reproduced, and the first reliable synthesis is credited to a research group in Dubna in the Soviet Union."
    isotopes:
      - [254, '詳しく研究されている核', "A nucleus studied in detail"]
      - [259, '最も長寿命・約58分', "Longest-lived isotope; about 58 minutes"]

  - Z: 103
    symbol: Lr
    en: Lawrencium
    ja: ローレンシウム
    discovered: 1961
    description: 1961年にバークレーで合成が報告され、サイクロトロンを発明したローレンスにちなんで名付けられました。アクチノイドの最後の元素で、2015年に日本原子力研究開発機構がイオン化エネルギーを初めて測定しました。
    description_en: "Its synthesis was reported at Berkeley in 1961, and it is named after Ernest Lawrence, who invented the cyclotron. It is the last of the actinides, and in 2015 the Japan Atomic Energy Agency measured its ionization energy for the first time."
    isotopes:
      - [266, '既知で最長寿命・約22時間', "Longest-lived known isotope; about 22 hours"]
      - [256, '日本で電離エネルギーを測定', "Ionization energy measured in Japan"]

  - Z: 104
    symbol: Rf
    en: Rutherfordium
    ja: ラザホージウム
    discovered: 1969  # Dubna 1964 の主張は IUPAC が不採用
    description: 1960年代にソ連のドゥブナとアメリカのバークレーがそれぞれ合成を報告し、原子核を発見したラザフォードにちなんで名付けられました。最初の超アクチノイド元素で、化学的にはハフニウムに似た性質をもつことが確かめられています。
    description_en: "In the 1960s, Dubna in the Soviet Union and Berkeley in the United States each reported synthesizing it, and it is named after Ernest Rutherford, who discovered the atomic nucleus. It is the first transactinide element, and its chemistry has been confirmed to be similar to that of hafnium."
    isotopes:
      - [267, '既知で最長寿命・約2.5時間', "Longest-lived known isotope; about 2.5 hours"]
      - [261, '化学実験に使われる', "Used in chemistry experiments"]

  - Z: 105
    symbol: Db
    en: Dubnium
    ja: ドブニウム
    discovered: 1970  # Dubna 1968 の主張は IUPAC が不採用
    description: 1960年代末から1970年にかけてソ連とアメリカがそれぞれ合成を報告し、命名争いの末にロシアの研究都市ドゥブナにちなんで名付けられました。ドゥブナの合同原子核研究所は数多くの超重元素の発見で知られています。
    description_en: "From the late 1960s to 1970, the Soviet Union and the United States each reported synthesizing it, and after a naming dispute it was named after Dubna, a Russian science city. Dubna's Joint Institute for Nuclear Research is known for discovering many superheavy elements."
    isotopes:
      - [268, '既知で最長寿命・約29時間', "Longest-lived known isotope; about 29 hours"]
      - [262, 'ニホニウムの崩壊系列に登場', "Appears in the decay chain of nihonium"]

  - Z: 106
    symbol: Sg
    en: Seaborgium
    ja: シーボーギウム
    discovered: 1974
    description: 1974年にバークレーのギオルソらがカリホルニウムに酸素を当てて合成し、シーボーグにちなんで名付けられました。命名当時シーボーグは存命で、生きている人物の名を冠した最初の元素とされます。
    description_en: "Synthesized in 1974 by Ghiorso and colleagues at Berkeley by bombarding californium with oxygen, it is named after Glenn Seaborg. Seaborg was still alive when it was named, and it is considered the first element named after a living person."
    isotopes:
      - [263, '発見時に合成された同位体', "The isotope made in the discovery"]
      - [269, '既知で最長寿命・約5分', "Longest-lived known isotope; about 5 minutes"]

  - Z: 107
    symbol: Bh
    en: Bohrium
    ja: ボーリウム
    discovered: 1981
    description: 1981年にドイツのダルムシュタットにある重イオン研究所（GSI）で、ビスマスにクロムを当てて合成されました。原子模型で知られるデンマークの物理学者ニールス・ボーアにちなんで名付けられました。
    description_en: "It was synthesized in 1981 at the heavy-ion research center GSI in Darmstadt, Germany, by bombarding bismuth with chromium. It is named after Niels Bohr, the Danish physicist known for his model of the atom."
    isotopes:
      - [262, '発見時に合成された同位体', "The isotope made in the discovery"]
      - [266, '理研が直接合成し性質を確認', "Made directly at RIKEN, which confirmed its properties"]
      - [270, '既知で最長寿命・約4分', "Longest-lived known isotope; about 4 minutes"]

  - Z: 108
    symbol: Hs
    en: Hassium
    ja: ハッシウム
    discovered: 1984
    description: 1984年にGSIで鉛に鉄を当てて合成され、GSIのあるドイツ・ヘッセン州のラテン名ハッシアにちなんで名付けられました。寿命はごく短いものの化学実験が行われ、オスミウムと同じ族の性質をもつことが確かめられました。
    description_en: "Synthesized at GSI in 1984 by bombarding lead with iron, it is named after Hassia, the Latin name for the German state of Hesse, where GSI is located. Although its lifetime is very short, chemistry experiments have been carried out on it, confirming that it behaves like a member of the same group as osmium."
    isotopes:
      - [265, '発見時に合成された同位体', "The isotope made in the discovery"]
      - [269, '既知で最長寿命・約15秒', "Longest-lived known isotope; about 15 seconds"]
      - [270, '変形核の二重魔法数とされる', "Considered a doubly magic deformed nucleus"]

  - Z: 109
    symbol: Mt
    en: Meitnerium
    ja: マイトネリウム
    discovered: 1982
    description: 1982年にGSIでビスマスに鉄を当てて合成され、最初はたった1個の原子が観測されただけでした。核分裂の発見に貢献したオーストリア出身の物理学者リーゼ・マイトナーにちなんで名付けられました。
    description_en: "It was synthesized at GSI in 1982 by bombarding bismuth with iron, and at first just a single atom was observed. It is named after Lise Meitner, the Austrian-born physicist who helped discover nuclear fission."
    isotopes:
      - [266, '発見時に合成された同位体', "The isotope made in the discovery"]
      - [270, 'ニホニウム崩壊系列で初観測', "First seen in the decay chain of nihonium"]

  - Z: 110
    symbol: Ds
    en: Darmstadtium
    ja: ダームスタチウム
    discovered: 1994
    description: 1994年にGSIで鉛にニッケルを当てて合成され、研究所のあるダルムシュタット市にちなんで名付けられました。寿命は非常に短く、多くの同位体は1秒にも満たない時間で崩壊します。
    description_en: "Synthesized at GSI in 1994 by bombarding lead with nickel, it is named after the city of Darmstadt, where the institute is located. Its lifetimes are very short, and most of its isotopes decay in less than a second."
    isotopes:
      - [269, '発見時に合成された同位体', "The isotope made in the discovery"]
      - [281, '比較的長寿命・約14秒', "Relatively long-lived; about 14 seconds"]

  - Z: 111
    symbol: Rg
    en: Roentgenium
    ja: レントゲニウム
    discovered: 1994
    description: 1994年にGSIでビスマスにニッケルを当てて合成され、X線を発見したレントゲンにちなんで名付けられました。周期表では金の下に位置しますが、ごくわずかな原子しか作れないため化学的性質はほとんどわかっていません。
    description_en: "Synthesized at GSI in 1994 by bombarding bismuth with nickel, it is named after Röntgen, who discovered X-rays. It sits below gold in the periodic table, but because only a handful of atoms can be made, almost nothing is known about its chemistry."
    isotopes:
      - [272, '発見時に合成された同位体', "The isotope made in the discovery"]
      - [274, 'ニホニウムの娘核・理研で発見', "Daughter of nihonium; discovered at RIKEN"]
      - [282, '既知で最長寿命・約2分', "Longest-lived known isotope; about 2 minutes"]

  - Z: 112
    symbol: Cn
    en: Copernicium
    ja: コペルニシウム
    discovered: 1996
    description: 1996年にGSIで鉛に亜鉛を当てて合成され、地動説を唱えたコペルニクスにちなんで名付けられました。周期表では水銀の下に位置し、水銀に似て揮発しやすいことを示す化学実験も行われています。
    description_en: "Synthesized at GSI in 1996 by bombarding lead with zinc, it is named after Copernicus, who proposed that the Earth moves around the Sun. It sits below mercury in the periodic table, and chemistry experiments have also shown that, like mercury, it evaporates easily."
    isotopes:
      - [277, '発見時に合成・理研でも確認', "Made in the discovery; also confirmed at RIKEN"]
      - [283, '化学実験に使われた', "Used in chemistry experiments"]
      - [285, '長寿命・半減期約30秒', "Long-lived; half-life about 30 seconds"]

  - Z: 113
    symbol: Nh
    en: Nihonium
    ja: ニホニウム
    discovered: 2004  # 出典は 2003–2004。理研の初観測 2004
    description: 理研の森田浩介らのグループが、線形加速器RILACで加速した亜鉛70をビスマス209に衝突させて合成し、2004年に初めて観測しました。2016年、アジアで初めて発見された元素として「日本」にちなんで命名されました。
    description_en: "A group led by Kosuke Morita at RIKEN synthesized it by smashing zinc-70, accelerated in the RILAC linear accelerator, into bismuth-209, and first observed it in 2004. In 2016, as the first element discovered in Asia, it was named after \"Nihon\" (Japan)."
    isotopes:
      - [278, '理研で合成・日本初の新元素', "Made at RIKEN; Japan's first new element"]
      - [286, '既知で最長寿命・約12秒', "Longest-lived known isotope; about 12 seconds"]

  - Z: 114
    symbol: Fl
    en: Flerovium
    ja: フレロビウム
    discovered: 1999
    description: 1998年以降、ロシアのドゥブナ合同原子核研究所でプルトニウム244にカルシウム48を当てて合成されました。同研究所のフレロフ原子核反応研究所と、その名の由来である物理学者フレロフにちなんで名付けられました。
    description_en: "From 1998 onward, it was synthesized at the Joint Institute for Nuclear Research in Dubna, Russia, by bombarding plutonium-244 with calcium-48. It is named after the institute's Flerov Laboratory of Nuclear Reactions and the physicist Georgy Flerov, after whom the laboratory is named."
    isotopes:
      - [289, 'カルシウムビームで合成・約2秒', "Made with a calcium beam; about 2 seconds"]

  - Z: 115
    symbol: Mc
    en: Moscovium
    ja: モスコビウム
    discovered: 2003
    description: 2003年にドゥブナ合同原子核研究所とアメリカの研究者が、アメリシウムにカルシウム48を当てて合成しました。研究所のあるモスクワ州にちなんで名付けられ、原子は1秒にも満たない時間で崩壊します。
    description_en: "In 2003, researchers from the Joint Institute for Nuclear Research in Dubna and the United States synthesized it by bombarding americium with calcium-48. It is named after the Moscow region, where the institute is located, and its atoms decay in less than a second."
    isotopes:
      - [288, '発見時に合成された同位体', "The isotope made in the discovery"]
      - [290, '既知で最長寿命・約0.8秒', "Longest-lived known isotope; about 0.8 seconds"]

  - Z: 116
    symbol: Lv
    en: Livermorium
    ja: リバモリウム
    discovered: 2000
    description: 2000年にドゥブナでキュリウムにカルシウム48を当てて合成され、共同研究を行ったアメリカのローレンス・リバモア国立研究所にちなんで名付けられました。同位体の寿命は長いものでも1秒に届きません。
    description_en: "Synthesized at Dubna in 2000 by bombarding curium with calcium-48, it is named after Lawrence Livermore National Laboratory in the United States, which took part in the joint research. Even its longest-lived isotopes last less than a second."
    isotopes:
      - [292, 'キュリウム標的で合成', "Made with a curium target"]
      - [293, '既知で最長寿命・約0.07秒', "Longest-lived known isotope; about 0.07 seconds"]

  - Z: 117
    symbol: Ts
    en: Tennessine
    ja: テネシン
    discovered: 2009
    description: ドゥブナとアメリカの研究所の共同研究で、バークリウムにカルシウム48を当てて合成され、2010年に発表されました。標的のバークリウムを製造したオークリッジ国立研究所などがあるテネシー州にちなんで名付けられました。
    description_en: "It was synthesized in joint research between Dubna and laboratories in the United States by bombarding berkelium with calcium-48, and was announced in 2010. It is named after the state of Tennessee, home to Oak Ridge National Laboratory, which produced the berkelium target, and other institutions."
    isotopes:
      - [293, 'バークリウム標的で合成', "Made with a berkelium target"]
      - [294, '既知で最長寿命・約0.07秒', "Longest-lived known isotope; about 0.07 seconds"]

  - Z: 118
    symbol: Og
    en: Oganesson
    ja: オガネソン
    discovered: 2002
    description: 2006年にドゥブナとアメリカの共同研究グループが、カリホルニウムにカルシウム48を当てて合成したと報告しました。現在知られている中で最も重い元素で、超重元素研究を率いたユーリ・オガネシアンにちなんで名付けられました。
    description_en: "In 2006, a joint research group from Dubna and the United States reported synthesizing it by bombarding californium with calcium-48. It is the heaviest element known today, and it is named after Yuri Oganessian, who led research on superheavy elements."
    isotopes:
      - [294, 'カリホルニウム標的で合成', "Made with a californium target"]

