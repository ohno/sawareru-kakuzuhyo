# Elements by Z (0 = the neutron; 119–126 have their systematic names only).
#   discovered  the "Observed" year of Wikipedia "Timeline of chemical element discoveries" (oldid=1384258232)
#   info, isotopes [A, note]  written for this app
elements:
  - Z: 0
    symbol: 'n'
    en: Neutron
    ja: 中性子
    discovered: 1932
    info: 陽子とともに原子核をつくる電気を帯びない粒子で、1932年にイギリスのチャドウィックが発見しました。原子核の外に出た自由な中性子は不安定で、半減期約10分で陽子・電子・反ニュートリノに崩壊します。
    isotopes:
      - [1, '自由中性子・半減期約10分']

  - Z: 1
    symbol: H
    en: Hydrogen
    ja: 水素
    discovered: 1671
    info: 宇宙で最も多く存在する元素で、恒星は水素の核融合によって輝いています。名前はギリシャ語の「水を生むもの」に由来し、燃料電池などのクリーンなエネルギー源としても注目されています。
    isotopes:
      - [1, '軽水素・天然の約99.99%']
      - [2, '重水素・核融合の燃料']
      - [3, '三重水素・半減期約12年']

  - Z: 2
    symbol: He
    en: Helium
    ja: ヘリウム
    discovered: 1868
    info: 1868年の日食の観測で太陽光のスペクトルから見つかり、ギリシャ語の太陽「ヘリオス」にちなんで名付けられました。軽く燃えないため風船に使われ、液体ヘリウムはMRIの超伝導磁石の冷却に欠かせません。
    isotopes:
      - [4, 'α粒子・二重魔法数の核']
      - [3, '希少・極低温の冷却に']
      - [6, '中性子ハロー核']

  - Z: 3
    symbol: Li
    en: Lithium
    ja: リチウム
    discovered: 1817
    info: 1817年にスウェーデンのアルフェドソンが発見し、ギリシャ語の「石（リトス）」が名前の由来です。最も軽い金属で、スマートフォンや電気自動車のリチウムイオン電池に欠かせません。
    isotopes:
      - [7, '天然の約95%']
      - [6, '核融合炉でトリチウム生産']
      - [11, '中性子ハロー核の代表例']

  - Z: 4
    symbol: Be
    en: Beryllium
    ja: ベリリウム
    discovered: 1798
    info: 宝石の緑柱石（ベリル）が名前の由来で、1798年にフランスのボークランが発見しました。軽くて硬くX線を通しやすいため、X線装置の窓や宇宙望遠鏡の鏡に使われますが、粉じんには強い毒性があります。
    isotopes:
      - [9, '唯一の安定同位体']
      - [10, '宇宙線で生成・約139万年']
      - [11, '中性子ハロー核']

  - Z: 5
    symbol: B
    en: Boron
    ja: ホウ素
    discovered: 1787
    info: 鉱物のホウ砂（ボラックス）が名前の由来で、1808年にゲイ＝リュサックらとデービーがそれぞれ単離しました。耐熱ガラスや半導体に使われ、ホウ素10は中性子をよく吸収するため原子炉の制御にも役立ちます。
    isotopes:
      - [11, '天然の約80%']
      - [10, '中性子を吸収・がん治療にも']
      - [8, '太陽ニュートリノの源']

  - Z: 6
    symbol: C
    en: Carbon
    ja: 炭素
    discovered: ancient
    info: ラテン語の「木炭（カルボ）」が名前の由来で、ダイヤモンドや黒鉛など性質の大きく異なる姿をとります。すべての生物の体をつくる基本元素で、放射性の炭素14は遺跡や遺物の年代測定に使われます。
    isotopes:
      - [12, '原子質量の基準・天然の約99%']
      - [14, '年代測定・半減期約5700年']
      - [11, 'PET検査に利用']

  - Z: 7
    symbol: 'N'
    en: Nitrogen
    ja: 窒素
    discovered: 1772
    info: 空気の約8割を占める気体で、1772年にスコットランドのダニエル・ラザフォードが発見しました。タンパク質やDNAに欠かせない元素で、アンモニアを経て化学肥料の原料として大量に使われています。
    isotopes:
      - [14, '天然の約99.6%']
      - [15, '安定・窒素循環の追跡に']
      - [13, 'PET検査に利用']

