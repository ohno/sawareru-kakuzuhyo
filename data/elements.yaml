    info: 酸素に次いで地殻に多い元素で、ラテン語の「火打ち石（シレックス）」が名前の由来です。コンピューターの半導体チップや太陽電池の材料として、現代のエレクトロニクスを支えています。
    isotopes:
      - [28, '天然の約92%・kg再定義に']
      - [32, '宇宙線で生成・約157年']

  - Z: 15
