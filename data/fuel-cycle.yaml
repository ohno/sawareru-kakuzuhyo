# Fuel-cycle groups, written for this app. members: [Z, A, note, English note] (null: the group's note is shown)
notes:
  major: 使用済み燃料に残るウランと、原子炉の中で生まれたプルトニウム。
  ma: 原子炉の中でウランが中性子を吸収してできる、プルトニウム以外の超ウラン元素。
  llfp: 半減期が非常に長い核分裂生成物で、高レベル放射性廃棄物の長期的な影響の要因。
notes_en:
  major: The uranium left in spent fuel, and the plutonium made in the reactor.
  ma: Transuranium elements other than plutonium, made when uranium in a reactor absorbs neutrons.
  llfp: Fission products with very long half-lives, behind the long-term effects of high-level radioactive waste.
